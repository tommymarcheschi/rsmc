name: engine-nightly

# Replaces the Mac launchd nightly chain. Sequential, dependency-ordered,
# each step continue-on-error so one failure can't block the rest (mirrors
# the resilient per-job launchd design). rank-cards no-ops cleanly until
# migration 017 is applied. Times are UTC; ordering is what matters.

on:
  schedule:
    - cron: '15 9 * * *'
  workflow_dispatch:

concurrency:
  group: engine-nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
      # pokemontcg.io API key — improves resolver step 2 (rate limit goes
      # from ~30/hr unauth to ~20k/day) and feeds the same X-Api-Key
      # header through tcg-api.ts / auto-heal.ts / detect-new-sets.ts /
      # refresh-index.ts. Secret was set repo-wide on 2026-05-18 but
      # never exposed as a job env var, which is part of why the
      # snapshot pipeline went silently dead the same day.
      POKEMON_TCG_API_KEY: ${{ secrets.POKEMON_TCG_API_KEY }}
      # Per-day ingest cap. The script processes cards in priority order
      # (owned > watched > value-ranked), so this is the size of the daily
      # owned-first wave, not a coverage ceiling. Bump if scrape latency
      # stays well under the 120-min job timeout.
      TROVE_INGEST_LIMIT: '100'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: detect-new-sets
        continue-on-error: true
        run: node_modules/.bin/tsx scripts/detect-new-sets.ts

      - name: auto-heal-sets
        continue-on-error: true
        run: node_modules/.bin/tsx scripts/auto-heal-sets.ts

      # Priority queue: owned cards first, then watched, then top
      # value-ranked catalog rows. Capped daily so the job stays inside
      # its 120-min timeout. Replaces the prior --set base1..base5 mode
      # which had pinned coverage at ~14 cards out of 20k catalog —
      # collection cards were never reached. Resolver uses migration 024
      # cache so each card resolves productId only once forever.
      - name: ingest-condition-prices
        continue-on-error: true
        run: node_modules/.bin/tsx scripts/ingest-condition-prices.ts --priority --limit "$TROVE_INGEST_LIMIT"

      - name: snapshot-card-index
        continue-on-error: true
        run: node_modules/.bin/tsx scripts/snapshot-card-index.ts

      - name: coverage-ledger
        continue-on-error: true
        run: node_modules/.bin/tsx scripts/coverage-ledger.ts

      - name: rank-cards
        continue-on-error: true
        run: node_modules/.bin/tsx scripts/rank-cards.ts
